global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: "service_client"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["service_client:8081"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
