version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_client
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: service_client
    ports:
      - "3307:3306"  # Pas en conflit avec 3308 (produit) ni 3309 (commande)
    volumes:
      - mysql_data_client:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq_client
    ports:
      - "5674:5672"       # 5673 est déjà pris → on prend 5674
      - "15674:15672"     # 15673 est déjà pris → on prend 15674
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  service_client:
    build: .
    container_name: service_client
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_client:3306/service_client?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      # RabbitMQ config
      SPRING_RABBITMQ_HOST: rabbitmq_client
      SPRING_RABBITMQ_PORT: 5672          # Port *interne* conteneur RabbitMQ (ne pas changer)
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      SERVER_PORT: 8074                   # Port spécifique pour service_client
      JWT_SECRET: "mYmvI1eMKEhT8/LciNCcJqyqSg9XKzTuNNmemn0fAnA="
      JAVA_OPTS: -Xms128m -Xmx256m
    ports:
      - "8074:8074"

volumes:
  mysql_data_client:
