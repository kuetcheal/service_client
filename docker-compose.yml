version: "3.9"

services:
  mysql:
    image: mysql:8.0
    # container_name: mysql_client   # (optionnel) à éviter pour garder les alias réseau par défaut
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: service_client
    ports:
      - "3307:3306"                       # 3307 sur ta machine -> 3306 dans le conteneur
    volumes:
      - mysql_data_client:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    # container_name: rabbitmq_client # (optionnel)
    ports:
      - "5674:5672"                     # AMQP
      - "15674:15672"                   # UI d'admin
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  service_client:
    image: ghcr.io/kuetcheal/service_client:develop   # ← image buildée par GitHub Actions
    # container_name: service_client                   # (optionnel)
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # --- MySQL ---
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/service_client?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      # --- RabbitMQ ---
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      # --- App ---
      SERVER_PORT: 8074
      JWT_SECRET: "mYmvI1eMKEhT8/LciNCcJqyqSg9XKzTuNNmemn0fAnA="
      JAVA_OPTS: "-Xms128m -Xmx256m"
    ports:
      - "8074:8074"
    restart: unless-stopped

volumes:
  mysql_data_client:
