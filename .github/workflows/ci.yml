name: ci

on:
  push:
    branches: ['feature/**', 'develop', 'main']
    tags:     ['v*.*.*']              # release semver
  pull_request:
    branches: ['develop', 'main']

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}   # ex: ghcr.io/kuetcheal/service_client

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test (Maven)
        run: mvn -B -DskipTests=false package

      - name: Upload jar & reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jar-and-reports
          path: |
            target/*.jar
            **/target/surefire-reports/**

  docker:
    needs: build_test
    if: github.event_name != 'pull_request'     # ne push pas l'image sur les PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (GitFlow tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # → branche develop
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            # → branche main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # → tag semver vX.Y.Z
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref,'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref,'refs/tags/v') }}
            # → tag sha pour traçabilité
            type=sha,prefix=sha-

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
