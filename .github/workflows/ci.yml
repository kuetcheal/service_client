name: ci

on:
  push:
    branches:
      - 'feature/**'
      - develop
      - main
    tags:
      - 'v*.*.*'      # déclenche aussi quand tu pousses un tag de release
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}  # ghcr.io/kuetcheal/service_client


jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Lint + tests
        run: |
          mvn -B -DskipTests=false test
          mvn -B -DskipTests package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: |
            **/target/*.jar
            **/target/surefire-reports/**

  docker:
    needs: build_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Génère des tags selon GitFlow (branche, SHA, semver)
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch        # ex: develop, feature-integration_et_deploiement_continue
            type=sha,prefix=sha-         # ex: sha-abc1234
            type=semver,pattern={{version}}   # si tu pushes un tag vX.Y.Z
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Tag 'latest' quand on pousse sur main (utile pour prod)
      - name: Tag latest on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker build -t $IMAGE:latest .
          docker push $IMAGE:latest
